name: CoderSwitch
options:
  bundleIdPrefix: dev.forbes
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  Hummingbird:
    url: https://github.com/hummingbird-project/hummingbird
    from: 2.0.0
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0

targets:
  CoderSwitch:
    type: application
    platform: macOS
    sources:
      - path: CoderSwitch
    resources:
      - path: CoderSwitch/Resources
        optional: true
    info:
      path: CoderSwitch/Info.plist
      properties:
        CFBundleName: CoderSwitch
        CFBundleDisplayName: CoderSwitch
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 f9Labs"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: CoderSwitch/CoderSwitch.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.forbes.CoderSwitch
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CoderSwitch/Info.plist
        CODE_SIGN_ENTITLEMENTS: CoderSwitch/CoderSwitch.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: Hummingbird
        product: Hummingbird
      - package: GRDB
        product: GRDB
  CoderSwitchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CoderSwitchTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CoderSwitch.app/Contents/MacOS/CoderSwitch"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: CoderSwitch

schemes:
  CoderSwitch:
    build:
      targets:
        CoderSwitch: all
        CoderSwitchTests: [test]
    test:
      targets:
        - CoderSwitchTests
