name: CoderSwitch
options:
  bundleIdPrefix: dev.forbes
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # A stable signing identity keeps the Keychain's "Always Allow" valid across
    # rebuilds. Ad-hoc builds change identity every build and re-prompt.
    DEVELOPMENT_TEAM: V3433WKX82
    CODE_SIGN_IDENTITY: Apple Development
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  CoderSwitchCore:
    path: ../coderswitch-studio/Packages/CoderSwitchCore

targets:
  CoderSwitch:
    type: application
    platform: macOS
    sources:
      - path: CoderSwitch/App
      - path: CoderSwitch/Views
      - path: CoderSwitch/Resources
        optional: true
    info:
      path: CoderSwitch/Info.plist
      properties:
        CFBundleName: CoderSwitch
        CFBundleDisplayName: CoderSwitch
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 f9Labs"
    entitlements:
      path: CoderSwitch/CoderSwitch.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.forbes.CoderSwitchMenuBar
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CoderSwitch/Info.plist
        CODE_SIGN_ENTITLEMENTS: CoderSwitch/CoderSwitch.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: CoderSwitchCore
        product: CoderSwitchCore

schemes:
  CoderSwitch:
    build:
      targets:
        CoderSwitch: all
